<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free IQ Test</title>
  <meta name="description" content="Free online IQ test: three tests with logic puzzles, number series and visual matrices. No sign-up, no paywall. Available in 7 languages.">
  <meta name="theme-color" content="#4f46e5">
  <meta property="og:title" content="Free IQ Test">
  <meta property="og:description" content="Three tests, instant free results, 7 languages.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">🧠 Free IQ Test</a>
    <div class="top-right">
      <div class="timer" id="timer" hidden aria-live="off">25:00</div>
      <select id="lang-select" class="lang-select" data-i18n-aria="lang"></select>
    </div>
  </header>

  <main id="app">
    <!-- Стартовый экран -->
    <section id="screen-start" class="screen card">
      <h1 data-i18n="start.title"></h1>
      <p class="lead" data-i18n-html="start.lead"></p>
      <h2 class="pick-title" data-i18n="start.pick"></h2>
      <div id="test-picker" class="picker" role="radiogroup" data-i18n-aria="start.pick"></div>
      <p id="test-desc" class="test-desc"></p>
      <p class="note" data-i18n="start.inspired"></p>
      <ul class="rules" data-i18n-list="start.rules"></ul>
      <div class="actions">
        <button class="btn primary" id="btn-start" data-i18n="start.begin"></button>
        <button class="btn" id="btn-resume" hidden></button>
      </div>
      <p class="note" data-i18n="start.disclaimer"></p>
    </section>

    <!-- Экран вопроса -->
    <section id="screen-quiz" class="screen" hidden>
      <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="card">
        <div class="q-meta">
          <span id="q-counter"></span>
          <span id="q-category" class="tag"></span>
        </div>
        <h2 id="q-text" class="q-text"></h2>
        <div id="q-matrix" class="matrix" hidden></div>
        <div id="q-options" class="options" role="radiogroup"></div>
        <div class="nav">
          <button class="btn" id="btn-prev" data-i18n="quiz.prev"></button>
          <button class="btn primary" id="btn-next" data-i18n="quiz.next"></button>
        </div>
      </div>
      <details class="card qmap-wrap">
        <summary data-i18n="quiz.map"></summary>
        <div id="qmap" class="qmap"></div>
        <button class="btn danger" id="btn-finish" data-i18n="quiz.finishTest"></button>
      </details>
    </section>

    <!-- Результат -->
    <section id="screen-result" class="screen" hidden>
      <div class="card result">
        <p class="result-label" id="r-test"></p>
        <p class="result-label" data-i18n="result.label"></p>
        <div class="iq" id="r-iq">100</div>
        <p class="result-level" id="r-level"></p>
        <div class="bell" id="r-bell"></div>
        <p id="r-summary"></p>
        <div class="stats">
          <div><strong id="r-correct">0</strong><span data-i18n="result.correct"></span></div>
          <div><strong id="r-percentile">0</strong><span data-i18n="result.percentile"></span></div>
          <div><strong id="r-time">0:00</strong><span data-i18n="result.time"></span></div>
        </div>
      </div>
      <div class="card">
        <h3 data-i18n="result.byType"></h3>
        <div id="r-categories" class="cats"></div>
      </div>
      <div class="actions center">
        <button class="btn primary" id="btn-review" data-i18n="result.review"></button>
        <button class="btn" id="btn-share" data-i18n="result.share"></button>
        <button class="btn" id="btn-restart" data-i18n="result.restart"></button>
        <button class="btn" id="btn-choose" data-i18n="result.choose"></button>
      </div>
      <p class="note center" id="share-status" aria-live="polite"></p>
      <div id="share-panel" class="card share-panel" hidden>
        <h3 data-i18n="share.title"></h3>
        <img id="share-img" class="share-img" data-i18n-alt="share.imgAlt" alt="">
        <div class="actions center">
          <a class="btn primary" id="share-download" download="iq-result.png" data-i18n="share.download"></a>
          <button class="btn" id="share-copy" data-i18n="share.copy"></button>
        </div>
        <div class="actions center share-links">
          <a class="btn" id="share-tg" target="_blank" rel="noopener">Telegram</a>
          <a class="btn" id="share-wa" target="_blank" rel="noopener">WhatsApp</a>
          <a class="btn" id="share-vk" target="_blank" rel="noopener">VK</a>
        </div>
        <p class="note center" data-i18n="share.hint"></p>
      </div>
      <p class="note center" id="r-note"></p>
      <div id="review" class="review" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer"></p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/ru.js"></script>
  <script src="js/i18n/es.js"></script>
  <script src="js/i18n/pt.js"></script>
  <script src="js/i18n/de.js"></script>
  <script src="js/i18n/fr.js"></script>
  <script src="js/i18n/zh.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/bank/classic.js"></script>
  <script src="js/bank/extra.js"></script>
  <script src="js/tests.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
